<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Earth Online 🌍</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #22d3ee;
      --accent2: #a78bfa;
      --danger: #f43f5e;
      --success: #4ade80;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 12px;
      line-height: 1.4;
    }
    .header {
      text-align: center;
      margin-bottom: 16px;
      padding: 12px;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border-radius: 16px;
      border: 1px solid #334155;
    }
    .header h1 {
      font-size: 1.6rem;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    .stats {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .stats span { color: var(--text); font-weight: 600; }
    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .tab {
      flex: 1;
      min-width: 70px;
      padding: 10px 6px;
      background: var(--card);
      border: 1px solid #334155;
      border-radius: 12px;
      color: var(--muted);
      font-size: 0.85rem;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .tab.active {
      background: #164e63;
      color: var(--accent);
      border-color: var(--accent);
    }
    .panel { display: none; }
    .panel.active { display: block; }
    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 10px;
      border: 1px solid #334155;
    }
    .card h3 { font-size: 1rem; margin-bottom: 8px; color: var(--accent); }
    .mission-item, .inv-item, .shop-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #334155;
    }
    .mission-item:last-child, .inv-item:last-child, .shop-item:last-child { border-bottom: none; }
    .btn {
      padding: 8px 14px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.85rem;
      transition: transform 0.1s;
    }
    .btn:active { transform: scale(0.96); }
    .btn-primary { background: var(--accent); color: #0f172a; }
    .btn-purple { background: var(--accent2); color: #0f172a; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-success { background: var(--success); color: #0f172a; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .hp-bar-wrap {
      background: #334155;
      border-radius: 8px;
      height: 18px;
      overflow: hidden;
      margin: 8px 0;
    }
    .hp-bar {
      height: 100%;
      background: linear-gradient(90deg, #f43f5e, #fb7185);
      transition: width 0.3s;
    }
    .monster-name { font-size: 1.2rem; font-weight: 700; }
    .log {
      max-height: 140px;
      overflow-y: auto;
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 10px;
      padding: 8px;
      background: #0f172a;
      border-radius: 8px;
    }
    .log div { margin-bottom: 4px; }
    .empty { text-align: center; color: var(--muted); padding: 20px; }
    .badge {
      display: inline-block;
      background: #334155;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      margin-left: 6px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🌍 Earth Online</h1>
    <div class="stats">
      <div>Lv <span id="level">1</span></div>
      <div>EXP <span id="exp">0</span></div>
      <div>💰 <span id="gold">0</span></div>
      <div>📦 <span id="coins">0</span> 任務幣</div>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="missions">Mission</div>
    <div class="tab" data-tab="inventory">背包</div>
    <div class="tab" data-tab="market">Market</div>
    <div class="tab" data-tab="draw">Lucky</div>
    <div class="tab" data-tab="battle">打怪</div>
  </div>

  <!-- Missions -->
  <div id="missions" class="panel active">
    <div class="card">
      <h3>今日 Mission（每個只可完成一次）</h3>
      <div id="mission-list"></div>
    </div>
  </div>

  <!-- Inventory -->
  <div id="inventory" class="panel">
    <div class="card">
      <h3>你的背包</h3>
      <div id="inv-list"></div>
    </div>
  </div>

  <!-- Market -->
  <div id="market" class="panel">
    <div class="card">
      <h3>Market — 用任務幣買固定傷害道具</h3>
      <div id="shop-list"></div>
    </div>
  </div>

  <!-- Lucky Draw -->
  <div id="draw" class="panel">
    <div class="card">
      <h3>Lucky Draw</h3>
      <p style="color:var(--muted);font-size:0.9rem;margin-bottom:12px;">花 3 任務幣抽一次，傷害可以是 0！</p>
      <button class="btn btn-purple" id="btn-draw" style="width:100%;padding:14px;">🎰 抽獎（3 任務幣）</button>
      <div id="draw-result" style="margin-top:12px;text-align:center;font-size:1.1rem;"></div>
    </div>
  </div>

  <!-- Battle -->
  <div id="battle" class="panel">
    <div class="card">
      <div class="monster-name" id="monster-name">史萊姆 Lv.1</div>
      <div style="font-size:0.85rem;color:var(--muted);">HP: <span id="monster-hp">40</span> / <span id="monster-max">40</span></div>
      <div class="hp-bar-wrap"><div class="hp-bar" id="hp-bar" style="width:100%"></div></div>
      <div id="attack-buttons" style="margin-top:12px;"></div>
      <div class="log" id="battle-log"></div>
    </div>
  </div>

  <script>
    // ========== Data ==========
    const MISSIONS = [
      { id: 'work', name: '返工 / 上班', icon: '💼' },
      { id: 'sport', name: '運動 30 分鐘', icon: '🏃' },
      { id: 'study', name: '學習 / 讀書', icon: '📚' },
      { id: 'eat', name: '健康飲食', icon: '🥗' },
      { id: 'sleep', name: '早睡', icon: '😴' }
    ];

    const SHOP = [
      { id: 'wood', name: '木劍', dmg: 5, cost: 2, icon: '🔱' },
      { id: 'iron', name: '鐵劍', dmg: 12, cost: 4, icon: '⚔️' },
      { id: 'magic', name: '魔法彈', dmg: 20, cost: 7, icon: '🔮' },
      { id: 'fire', name: '火焰槍', dmg: 35, cost: 12, icon: '🔥' }
    ];

    const DRAW_POOL = [
      { name: '空獎...', dmg: 0, weight: 25 },
      { name: '小石子', dmg: 3, weight: 25 },
      { name: '鋼刃', dmg: 8, weight: 20 },
      { name: '青銅劍', dmg: 15, weight: 15 },
      { name: '雷電魔法', dmg: 25, weight: 10 },
      { name: '傷害大劍', dmg: 40, weight: 5 }
    ];

    // ========== State ==========
    let state = {
      coins: 0,
      gold: 0,
      exp: 0,
      level: 1,
      inventory: [],
      completedToday: {},
      lastDate: '',
      monster: { name: '史萊姆', level: 1, hp: 40, maxHp: 40 },
      log: []
    };

    // ========== Utils ==========
    function today() {
      return new Date().toISOString().slice(0, 10);
    }

    function save() {
      localStorage.setItem('earthOnline', JSON.stringify(state));
    }

    function load() {
      const raw = localStorage.getItem('earthOnline');
      if (raw) {
        const saved = JSON.parse(raw);
        state = { ...state, ...saved };
        // daily reset
        if (state.lastDate !== today()) {
          state.completedToday = {};
          state.lastDate = today();
          save();
        }
      } else {
        state.lastDate = today();
        save();
      }
    }

    function addLog(msg) {
      state.log.unshift(msg);
      if (state.log.length > 30) state.log.pop();
      save();
      renderLog();
    }

    function gainExp(amount) {
      state.exp += amount;
      while (state.exp >= state.level * 50) {
        state.exp -= state.level * 50;
        state.level++;
        addLog(`🎉 升級！現在是 Lv.${state.level}`);
      }
      save();
      renderStats();
    }

    // ========== Render ==========
    function renderStats() {
      document.getElementById('level').textContent = state.level;
      document.getElementById('exp').textContent = state.exp;
      document.getElementById('gold').textContent = state.gold;
      document.getElementById('coins').textContent = state.coins;
    }

    function renderMissions() {
      const list = document.getElementById('mission-list');
      list.innerHTML = MISSIONS.map(m => {
        const done = state.completedToday[m.id];
        return `
          <div class="mission-item">
            <div>${m.icon} ${m.name}</div>
            <button class="btn ${done ? 'btn-success' : 'btn-primary'}" 
                    ${done ? 'disabled' : ''} 
                    onclick="completeMission('${m.id}')">
              ${done ? '已完成' : '完成 +1幣'}
            </button>
          </div>`;
      }).join('');
    }

    function renderInventory() {
      const list = document.getElementById('inv-list');
      if (state.inventory.length === 0) {
        list.innerHTML = '<div class="empty">背包是空的，去 Market 或 Lucky Draw 拿道具吧</div>';
        return;
      }
      list.innerHTML = state.inventory.map((item, idx) => `
        <div class="inv-item">
          <div>${item.icon || '📦'} ${item.name} <span class="badge">${item.dmg} 傷害</span></div>
          <button class="btn btn-danger" onclick="useItem(${idx})">使用攻擊</button>
        </div>`).join('');
    }

    function renderShop() {
      const list = document.getElementById('shop-list');
      list.innerHTML = SHOP.map(s => `
        <div class="shop-item">
          <div>${s.icon} ${s.name} <span class="badge">${s.dmg} 傷害</span></div>
          <button class="btn btn-primary" onclick="buyItem('${s.id}')" 
                  ${state.coins < s.cost ? 'disabled' : ''}>
            ${s.cost} 幣
          </button>
        </div>`).join('');
    }

    function renderBattle() {
      const m = state.monster;
      document.getElementById('monster-name').textContent = `${m.name} Lv.${m.level}`;
      document.getElementById('monster-hp').textContent = m.hp;
      document.getElementById('monster-max').textContent = m.maxHp;
      const pct = Math.max(0, (m.hp / m.maxHp) * 100);
      document.getElementById('hp-bar').style.width = pct + '%';

      const btns = document.getElementById('attack-buttons');
      if (state.inventory.length === 0) {
        btns.innerHTML = '<div class="empty">沒有可用道具，先去拿一些吧</div>';
      } else {
        btns.innerHTML = state.inventory.map((item, idx) => `
          <button class="btn btn-danger" style="margin:4px;" onclick="useItem(${idx})">
            ${item.icon || '📦'} ${item.name} (${item.dmg})
          </button>`).join('');
      }
      renderLog();
    }

    function renderLog() {
      const logEl = document.getElementById('battle-log');
      if (!logEl) return;
      logEl.innerHTML = state.log.slice(0, 12).map(l => `<div>${l}</div>`).join('') || '<div>還沒有戰鬥記錄</div>';
    }

    function renderAll() {
      renderStats();
      renderMissions();
      renderInventory();
      renderShop();
      renderBattle();
    }

    // ========== Actions ==========
    function completeMission(id) {
      if (state.completedToday[id]) return;
      state.completedToday[id] = true;
      state.coins += 1;
      addLog(`✅ 完成 Mission，獲得 1 任務幣`);
      save();
      renderAll();
    }

    function buyItem(id) {
      const item = SHOP.find(s => s.id === id);
      if (!item || state.coins < item.cost) return;
      state.coins -= item.cost;
      state.inventory.push({ ...item });
      addLog(`🛒 購買了 ${item.name} (+${item.dmg} 傷害)`);
      save();
      renderAll();
    }

    function doDraw() {
      if (state.coins < 3) {
        document.getElementById('draw-result').textContent = '任務幣不夠！';
        return;
      }
      state.coins -= 3;
      // weighted random
      const total = DRAW_POOL.reduce((s, i) => s + i.weight, 0);
      let r = Math.random() * total;
      let result = DRAW_POOL[0];
      for (const p of DRAW_POOL) {
        if (r < p.weight) { result = p; break; }
        r -= p.weight;
      }
      if (result.dmg > 0) {
        state.inventory.push({
          name: result.name,
          dmg: result.dmg,
          icon: '🎲',
          id: 'draw-' + Date.now()
        });
        document.getElementById('draw-result').innerHTML = `🎉 抽到 <b>${result.name}</b> (${result.dmg} 傷害)！`;
        addLog(`🎰 Lucky Draw 抽到 ${result.name} (${result.dmg})`);
      } else {
        document.getElementById('draw-result').innerHTML = `😔 ${result.name}`;
        addLog(`🎰 Lucky Draw：空獎...`);
      }
      save();
      renderAll();
    }

    function useItem(idx) {
      const item = state.inventory[idx];
      if (!item) return;
      state.inventory.splice(idx, 1);

      const m = state.monster;
      m.hp = Math.max(0, m.hp - item.dmg);
      addLog(`⚔️ 使用 ${item.name} 造成 ${item.dmg} 傷害！`);

      if (m.hp <= 0) {
        const goldGain = 5 + m.level * 3;
        const expGain = 10 + m.level * 5;
        state.gold += goldGain;
        gainExp(expGain);
        addLog(`🎉 擊敗 ${m.name} Lv.${m.level}！+${goldGain} 金幣 +${expGain} EXP`);

        // new stronger monster
        const newLevel = m.level + 1;
        const newMax = Math.round(m.maxHp * 1.3);
        state.monster = {
          name: m.name,
          level: newLevel,
          hp: newMax,
          maxHp: newMax
        };
        addLog(`🐍 新怪物出現！${state.monster.name} Lv.${newLevel} (HP ${newMax})`);
      }

      save();
      renderAll();
    }

    // ========== Tabs ==========
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.dataset.tab).classList.add('active');
        if (tab.dataset.tab === 'battle') renderBattle();
        if (tab.dataset.tab === 'inventory') renderInventory();
        if (tab.dataset.tab === 'market') renderShop();
      });
    });

    document.getElementById('btn-draw').addEventListener('click', doDraw);

    // ========== Init ==========
    load();
    renderAll();
  </script>
</body>
</html>
